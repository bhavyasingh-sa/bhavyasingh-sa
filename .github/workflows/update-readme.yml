name: Update open source list

on:
  schedule:
    # GitHub runs scheduled workflows when it has capacity, so this is a best effort, not a promise.
    # Press "Run workflow" for an immediate refresh.
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two at once, so two runs can't push over each other.
concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2 (pinned to commit)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rebuild the open source list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_open_source.py

      - name: Commit changes
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update open source contributions"
          git push
