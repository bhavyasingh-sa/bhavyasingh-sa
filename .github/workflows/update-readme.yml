name: Update open source list

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2 (pinned to commit)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rebuild the open source list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/update_open_source.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update open source contributions"
          git push
