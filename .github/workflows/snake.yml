name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Platane/snk v3.5.0 (pinned to commit)
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Contribution heatmap
        run: |
          mkdir -p dist
          curl -fsSL "https://ghchart.rshah.org/7fdbca/${{ github.repository_owner }}" \
            | sed -e 's/#EEEEEE/#0b2942/g' -e 's/#767676/#8da0b8/g' > dist/github-chart.svg

      # crazy-max/ghaction-github-pages v4.2.0 (pinned to commit)
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
